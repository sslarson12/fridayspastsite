<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugged In Videos | Fridays Past</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0908;
    --bg-raised: #131110;
    --blue: #5b8fb0;
    --blue-bright: #8fc1e0;
    --ink: #f0ece2;
    --ink-dim: #b8b2a6;
    --line: rgba(240,236,226,0.14);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }

  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }

  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:0 40px;
  }

  /* ---------- NAV ---------- */
  nav{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(10,9,8,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1280px;
    margin:0 auto;
    padding:18px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .nav-links{
    display:flex;
    gap:34px;
    list-style:none;
    font-family:'Oswald', sans-serif;
    font-size:14px;
    letter-spacing:0.14em;
    font-weight:500;
  }
  .nav-links a{
    color:var(--ink-dim);
    padding-bottom:6px;
    border-bottom:2px solid transparent;
    transition:color .2s ease, border-color .2s ease;
  }
  .nav-links a:hover, .nav-links a:focus-visible{
    color:var(--blue-bright);
  }
  .nav-logo{
    height:34px;
    width:auto;
  }

  @media (max-width: 720px){
    .nav-links{ gap:18px; font-size:12px; }
    .nav-inner{ padding:16px 20px; flex-wrap:wrap; justify-content:center; gap:12px; }
    .nav-logo{ height:26px; order:-1; }
  }

  /* ---------- PAGE HEAD ---------- */
  .page-head{
    text-align:center;
    padding:64px 0 8px;
  }
  .back-link{
    display:inline-block;
    margin-bottom:18px;
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--blue-bright);
  }
  .page-head h1{
    font-size:clamp(24px, 4vw, 36px);
    font-weight:600;
    letter-spacing:0.1em;
  }
  .page-head p{
    margin-top:14px;
    color:var(--ink-dim);
    font-size:15px;
  }
  .page-head .rule{
    width:64px;
    height:1px;
    background:var(--line);
    margin:22px auto 0;
    position:relative;
  }
  .page-head .rule::after{
    content:"▾";
    position:absolute;
    left:50%;
    top:-9px;
    transform:translateX(-50%);
    color:var(--blue);
    font-size:12px;
    background:var(--bg);
    padding:0 8px;
  }

  /* ---------- VIDEO GRID ---------- */
  .video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
    gap:26px;
    padding:44px 0 90px;
  }
  .video-item{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 16px 20px;
  }
  .media{
    position:relative;
    aspect-ratio:16/9;
    border-radius:3px;
    overflow:hidden;
    background:#000;
  }
  .media iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }
  .video-item .label{
    margin-top:14px;
    font-family:'Oswald', sans-serif;
    font-size:13px;
    letter-spacing:0.05em;
    color:var(--ink-dim);
  }

  /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:34px 0 40px;
  }
  .footer-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .footer-left{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .pick{
    width:58px; height:66px;
    border:1.5px solid var(--blue);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    clip-path:polygon(50% 0%, 100% 38%, 78% 100%, 22% 100%, 0% 38%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .pick span{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--blue-bright);
    letter-spacing:0.02em;
  }
  .footer-text .thanks{
    font-family:'Caveat', cursive;
    font-size:24px;
    color:var(--blue-bright);
    line-height:1.1;
  }
  .footer-text p{
    font-size:13.5px;
    color:var(--ink-dim);
    margin-top:4px;
  }
  .socials{ display:flex; gap:14px; }
  .social-icon{
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--blue-bright);
    transition:background .2s ease, transform .2s ease;
  }
  .social-icon:hover, .social-icon:focus-visible{
    background:rgba(91,143,176,0.14);
    transform:translateY(-2px);
  }
  .social-icon svg{ width:18px; height:18px; }

  @media (max-width: 640px){
    .footer-inner{ flex-direction:column; text-align:center; }
    .footer-left{ flex-direction:column; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ transition:none !important; }
  }
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--blue-bright);
    outline-offset:2px;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <ul class="nav-links">
      <li><a href="index.html#home">Home</a></li>
      <li><a href="index.html#music">Music</a></li>
      <li><a href="index.html#shows">Shows</a></li>
    </ul>
    <img class="nav-logo" src="logo.png" alt="Fridays Past">
    <ul class="nav-links">
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<main>
  <div class="page-head wrap">
    <a href="index.html#music" class="back-link">← Back to Home</a>
    <h1>Plugged In</h1>
    <p>Full band performances — the whole set, plugged in.</p>
    <div class="rule"></div>
  </div>

  <div class="wrap">
    <div class="video-grid">

      <div class="video-item">
        <div class="media">
          <iframe src="https://www.youtube.com/embed/DAIw-TyvHgI" title="Fridays Past Plugged In" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <div class="video-item">
        <div class="media">
          <iframe src="https://www.youtube.com/embed/MAoWZ7bvVo8" title="Fridays Past Plugged In" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <div class="video-item">
        <div class="media">
          <iframe src="https://www.youtube.com/embed/IG1uGxRjQLM" title="Fridays Past Plugged In" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <div class="video-item">
        <div class="media">
          <iframe src="https://www.youtube.com/embed/Yn8UqU8VVr0" title="Fridays Past Plugged In" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <!--
        TO ADD A NEW VIDEO: copy one whole block below (from <div class="video-item"> to the matching </div>)
        and paste it here, then swap in the new YouTube video ID in the src="https://www.youtube.com/embed/VIDEO_ID" line.

        <div class="video-item">
          <div class="media">
            <iframe src="https://www.youtube.com/embed/VIDEO_ID" title="Fridays Past Plugged In" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
      -->

    </div>
  </div>
</main>

<footer id="contact">
  <div class="wrap footer-inner">
    <div class="footer-left">
      <div class="pick"><span>FP</span></div>
      <div class="footer-text">
        <p class="thanks">Thanks for stopping by!</p>
        <p>We play the music we love for the people we love.</p>
      </div>
    </div>
    <div class="socials">
      <a href="https://www.instagram.com/fridayspast/" class="social-icon" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
      <a href="https://www.youtube.com/@FridaysPasta/playlists" class="social-icon" aria-label="YouTube" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M10.5 9.5l5 2.5-5 2.5v-5z" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
  </div>
</footer>

</body>
</html>
